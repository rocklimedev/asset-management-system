services:
  backend:
    image: ghcr.io/rocklimedev/asset-management-backend:latest
    container_name: asset-management-backend
    restart: unless-stopped

    ports:
      - "5005:5000"

    environment:
      NODE_ENV: production

    env_file:
      - ./.env

    networks:
      - app-network

networks:
  app-network:
    driver: bridge