
name: Deploy Asset Management Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Setup Docker Buildx
      # ----------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------
      # Login to GitHub Container Registry
      # ----------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rocklimedev
          password: ${{ secrets.GHCR_TOKEN }}

      # ----------------------------------------
      # Build and push backend image
      # ----------------------------------------
      - name: Build and push backend image
        run: |
          docker build --no-cache \
            -t ghcr.io/rocklimedev/asset-management-backend:latest \
            ./backend

          docker push ghcr.io/rocklimedev/asset-management-backend:latest

      # ----------------------------------------
      # Deploy to VPS
      # ----------------------------------------
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 66.116.204.81
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            # ----------------------------------------
            # Go to Asset Management project
            # ----------------------------------------
            cd /opt/apps/asset-management-system

            # ----------------------------------------
            # Login to GitHub Container Registry
            # ----------------------------------------
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u rocklimedev \
              --password-stdin

            # ----------------------------------------
            # Pull latest backend image
            # ----------------------------------------
            docker compose pull backend

            # ----------------------------------------
            # Recreate backend container
            # ----------------------------------------
            docker compose up -d --force-recreate backend

            # ----------------------------------------
            # Remove unused Docker images
            # ----------------------------------------
            docker image prune -f

            # ----------------------------------------
            # Show running containers
            # ----------------------------------------
            docker ps
